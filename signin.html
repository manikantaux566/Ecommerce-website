<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ElectroMart | Sign In</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/png" href="images/electromart-logo.png">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                ElectroMart
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Products
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        Wishlist
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                        <span id="cart-count">0</span>
                    </a>
                </li>

                <li>
                    <button
                        id="theme-toggle"
                        class="theme-toggle"
                        aria-label="Toggle dark mode"
                    >
                        🌙
                    </button>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         SIGN IN SECTION
    ========================== -->

    <main class="auth-section">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Sign in to continue shopping
            </p>


            <form id="signin-form">

                <div class="form-group">

                    <label for="signin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signin-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signin-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Sign In
                </button>


                <p
                    id="signin-message"
                    class="auth-message"
                ></p>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="css/js/main.js"></script>

    <script src="css/js/auth.js"></script>

</body>

</html>
