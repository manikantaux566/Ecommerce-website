<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ElectroMart | Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/png" href="images/electromart-logo.png">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">
            <div class="logo">
                <img src="images/electromart-logo.png" alt="ElectroMart Logo">
                <span>ElectroMart</span>
            </div>
        
            <ul class="nav-links">
        
                <li>
                    <a href="index.html">Home</a>
                </li>
        
                <li>
                    <a href="products.html">Products</a>
                </li>
        
                <li>
                    <a href="wishlist.html">Wishlist</a>
                </li>
        
                <li>
                    <a href="cart.html">
                        Cart
                        <span id="cart-count">0</span>
                    </a>
                </li>
        
                <li>
                    <button id="theme-toggle" class="theme-toggle" type="button">
                        🌙
                    </button>
                </li>
        
                <li id="auth-nav-item" class="signout-item">
                    <button
                        type="button"
                        id="auth-nav-button"
                        class="signout-btn"
                    >
                        Sign Out
                    </button>
                </li>
        
            </ul>
        
        </nav>

    </header>


    <!-- ================= CART ================= -->

    <main class="cart-section">

        <h1>Shopping Cart</h1>

        <div id="cart-container"></div>

        <div id="cart-summary"></div>
        <div class="checkout-section">

            <button
                id="checkout-btn"
                class="checkout-btn"
            >
                Proceed to Checkout
            </button>
        
        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="css/js/cart.js"></script>
    <script src="css/js/main.js"></script>

</body>

</html>
